# Shared by Docker Compose (local, CI) and the Ralph sandbox. See ADR 0004.
port: 4222
http_port: 8222

jetstream {
  # No store_dir here: each runtime passes its own `--store_dir`. nats-server rejects a config
  # value plus the flag as a duplicate, so the flag cannot override it.
  # fsync every write: a single node must not lose PubAcked messages on an OS crash.
  sync_interval: always
}
