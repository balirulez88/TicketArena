# Production NATS for the Fly.io app in this directory (ADR 0004, ADR 0013). Local and CI use
# infra/nats/nats.conf; the JetStream durability settings must stay the same in both.

server_name: ticketarena-nats

# Fly's private network (6PN) is IPv6; `[::]` listens on it (and nowhere public: fly.toml has no
# services, so nothing is exposed to the internet).
listen: "[::]:4222"
# Monitoring, for the Fly health check and `fly ssh console`; also private only.
http: "[::]:8222"

# Every app in the Fly organization shares the private network, so clients must present the token
# from the NATS_TOKEN Fly secret (the worker sends the same secret). The monitoring port above is
# not covered, which keeps the health check working.
authorization { token: $NATS_TOKEN }

jetstream {
  # On the Fly volume mounted at /data (fly.toml [mounts]), so streams survive restarts and deploys.
  store_dir: "/data/jetstream"
  # fsync every write: a single node must not lose PubAcked messages on a host crash.
  sync_interval: always
  # Below the 1 GB volume, so JetStream refuses new messages before the disk fills up.
  max_file_store: 768MB
  max_memory_store: 64MB
}
