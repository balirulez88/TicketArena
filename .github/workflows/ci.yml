# The full quality gate on real infrastructure: Biome, tsc, unit and integration tests.
# Services come from docker-compose.yml, the same definition developers use locally, so CI
# cannot drift from it. (GitHub `services:` cannot pass NATS its JetStream config.)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://ticketarena:ticketarena@localhost:55432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      TEST_NATS_URL: nats://localhost:4222
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Start Postgres, Redis and NATS
        run: docker compose up --detach --wait

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate (lint, typecheck, test)
        run: pnpm run check

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
