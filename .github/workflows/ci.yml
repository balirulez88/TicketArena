# The full quality gate on real infrastructure: Biome, tsc, unit and integration tests.
# Services come from docker-compose.yml, the same definition developers use locally, so CI
# cannot drift from it. (GitHub `services:` cannot pass NATS its JetStream config.)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://ticketarena:ticketarena@localhost:55432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      TEST_NATS_URL: nats://localhost:4222
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Start Postgres, Redis and NATS
        run: docker compose up --detach --wait

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate (lint, typecheck, test, harness tests)
        run: pnpm run check

      # ADR 0016: a maintainer's triage is auditable. Against the register this push or pull
      # request started from, no entry or history line disappears and every changed triage field
      # comes with a new history line. A new branch's first push has no "before" to compare.
      - name: Debt register audit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to audit against"; exit 0
          fi
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          if ! git cat-file -e "$BASE_SHA:docs/technical-debt.md" 2>/dev/null; then
            echo "the base has no register"; exit 0
          fi
          git show "$BASE_SHA:docs/technical-debt.md" > "$RUNNER_TEMP/debt-base.md"
          node scripts/ralph-debt.mjs audit docs/technical-debt.md --base "$RUNNER_TEMP/debt-base.md"

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes

  sandbox:
    name: Sandbox trust boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The host scripts (ralph-accept.mjs parses the lockfile) need the root devDependencies.
      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the sandbox image and runs stub-agent tickets through scripts/sandbox.sh (ADR 0014,
      # ADR 0015). It checks that nothing of the host is reachable from inside, that merges,
      # rejections and pause/resume reach the host only through validation, that a malicious
      # agent's forged merge and resume state are refused with the host unchanged, that a
      # malicious slice's tests cannot tamper with the host's hardened gate, and that only the
      # host's own isolated reviewers decide.
      - name: Sandbox boundary, acceptance and forgery refusal
        run: bash scripts/sandbox.test.sh
